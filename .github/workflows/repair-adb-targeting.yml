name: Repair ADB Targeting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[CC-REPAIR]')"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore original CommandCenter source and apply surgical ADB fix
        shell: pwsh
        run: |
          git checkout b86d206867cca63be566738eb120ada3b81b8149 -- CommandCenter.py
          python -c "from pathlib import Path; p=Path('CommandCenter.py'); s=p.read_text(encoding='utf-8'); old='return re.sub(pattern, lambda m: m.group(1) + f\'-s \"{serial}\" \', command)'; new='return re.sub(pattern, lambda m: m.group(1) + f\'-s {serial} \', command)'; assert old in s, 'ADB target line not found'; p.write_text(s.replace(old,new,1), encoding='utf-8')"
          python -m py_compile CommandCenter.py

      - name: Commit surgical fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CommandCenter.py
          git commit -m "[CC-REPAIR] Restore full Command Center and fix raw ADB serial targeting"
          git push origin HEAD:main
