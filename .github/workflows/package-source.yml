name: Package Command Center Source

on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','package','CommandCenter_Final.zip') } | Copy-Item -Destination package -Recurse -Force
          Compress-Archive -Path package\* -DestinationPath CommandCenter_Final.zip -Force

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CommandCenter-Final
          path: CommandCenter_Final.zip
          retention-days: 30
