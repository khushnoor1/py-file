name: Build Fixed Command Center

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  fix-and-package:
    if: "!contains(github.event.head_commit.message, '[CC-AUTO-FIX]')"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch ADB execution engine
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          p = Path('CommandCenter.py')
          s = p.read_text(encoding='utf-8')

          target_start = s.index('    def _target_adb_commands')
          target_end = s.index('\n    def _show_install_dialog', target_start)
          target = '''    def _target_adb_commands(self, command, serial):
              """Bind ADB commands to one selected DUT without adding quote characters to the serial.

              Explicitly targeted commands (for example ``adb -s ABC123 ...``) are left
              untouched. ``{SERIAL}`` is replaced with the raw ADB serial.
              """
              serial = str(serial or "").strip().strip('"')
              command = str(command or "").replace("{SERIAL}", serial)
              if not serial:
                  return command
              pattern = r'(?i)(\\badb(?:\\.exe)?\\s+)(?!-s(?:\\s|$)|--serial(?:\\s|=))'
              return re.sub(pattern, lambda m: m.group(1) + f'-s {serial} ', command)
          '''
          s = s[:target_start] + target + s[target_end:]

          exec_start = s.index('    def _run_process')
          exec_end = s.index('\n    def stop_execution', exec_start)
          execution = '''    def _run_process(self, cmd_str, label="", command_type="CMD Command", serial=""):
              """Execute a command with predictable Windows process boundaries and diagnostics."""
              serial_clean = str(serial or "").strip().strip('"')

              def worker():
                  p = None
                  try:
                      raw = str(cmd_str or "").strip()
                      if not raw:
                          self.log(f"[{label}] Error: empty command")
                          return
                      env = os.environ.copy()
                      if serial_clean:
                          env["SERIAL"] = serial_clean
                          env["DUT_SERIAL"] = serial_clean

                      is_single_adb = bool(re.match(r'(?is)^\\s*adb(?:\\.exe)?\\s+', raw)) and not any(x in raw for x in ("&", "&&", "|", "\\n", "\\r"))
                      if is_single_adb:
                          import shlex
                          parts = shlex.split(raw, posix=False)
                          parts = [x[1:-1] if len(x) >= 2 and x[0] == x[-1] == '"' else x for x in parts]
                          launch = parts if parts and parts[0].lower() in ("adb", "adb.exe") else ["cmd.exe", "/d", "/s", "/c", raw]
                      elif command_type == "PowerShell Script":
                          launch = ["powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", raw]
                      else:
                          launch = ["cmd.exe", "/d", "/s", "/c", raw]

                      self.log(f"[{label}] EXEC: {raw}")
                      p = subprocess.Popen(launch, shell=False, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                           stdin=subprocess.DEVNULL, text=True, encoding="utf-8", errors="replace",
                                           env=env, creationflags=WIN_NO_CONSOLE)
                      with self.active_processes_lock:
                          self.active_processes.add(p)
                      for line in iter(p.stdout.readline, ""):
                          if self.stop_event.is_set():
                              try: p.terminate()
                              except Exception: pass
                              break
                          if line.strip():
                              self.log(f"[{label}] {line.rstrip()}")
                      p.stdout.close()
                      rc = p.wait()
                      self.log(f"[{label}] {'COMPLETED' if rc == 0 else f'FAILED (exit {rc})'}")
                  except Exception as e:
                      self.log(f"[{label}] Error: {type(e).__name__}: {e}")
                  finally:
                      if p is not None:
                          with self.active_processes_lock:
                              self.active_processes.discard(p)
              threading.Thread(target=worker, daemon=True).start()

          def _run_temp_script(self, script_text, typ, label):
              """Run a saved Batch/PowerShell command for exactly one selected DUT."""
              suffix = ".ps1" if typ == "PowerShell Script" else ".bat"
              safe_label = re.sub(r"[^A-Za-z0-9_-]", "_", str(label or "DUT"))
              fd, path = tempfile.mkstemp(prefix=f"cc_{safe_label}_", suffix=suffix)
              os.close(fd)
              serial = str(label or "").strip().strip('"')
              try:
                  text = str(script_text or "")
                  if typ == "Batch Script":
                      header = f'@echo off\\r\\nset "SERIAL={serial}"\\r\\nset "DUT_SERIAL={serial}"\\r\\n'
                      text = header + text
                      with open(path, "w", encoding="utf-8", newline="") as f:
                          f.write(text.replace("\\n", "\\r\\n"))
                      launch = ["cmd.exe", "/d", "/c", "call", path]
                  else:
                      with open(path, "w", encoding="utf-8", newline="\\n") as f:
                          f.write(text)
                      launch = ["powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", path]

                  def worker():
                      p = None
                      try:
                          env = os.environ.copy()
                          env["SERIAL"] = serial
                          env["DUT_SERIAL"] = serial
                          self.log(f"[{serial}] SCRIPT EXEC: {os.path.basename(path)}")
                          p = subprocess.Popen(launch, shell=False, cwd=os.path.dirname(path),
                                               stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                               stdin=subprocess.DEVNULL, text=True, encoding="utf-8",
                                               errors="replace", env=env, creationflags=WIN_NO_CONSOLE)
                          with self.active_processes_lock:
                              self.active_processes.add(p)
                          for line in iter(p.stdout.readline, ""):
                              if self.stop_event.is_set():
                                  try: p.terminate()
                                  except Exception: pass
                                  break
                              if line.strip():
                                  self.log(f"[{serial}] {line.rstrip()}")
                          p.stdout.close()
                          rc = p.wait()
                          self.log(f"[{serial}] SCRIPT {'COMPLETED' if rc == 0 else f'FAILED (exit {rc})'}")
                      except Exception as e:
                          self.log(f"[{serial}] Script Error: {type(e).__name__}: {e}")
                      finally:
                          if p is not None:
                              with self.active_processes_lock:
                                  self.active_processes.discard(p)
                          try: os.remove(path)
                          except OSError: pass
                  threading.Thread(target=worker, daemon=True).start()
              except Exception:
                  try: os.remove(path)
                  except OSError: pass
                  raise
          '''
          s = s[:exec_start] + execution + s[exec_end:]
          p.write_text(s, encoding='utf-8')
          '@ | Set-Content patch_cc.py -Encoding UTF8
          python patch_cc.py
          python -m py_compile CommandCenter.py

      - name: Commit fixed source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CommandCenter.py
          git commit -m "[CC-AUTO-FIX] Fix ADB and batch command execution"
          git push origin HEAD:main

      - name: Package final source
        shell: pwsh
        run: |
          if (Test-Path CommandCenter_Final.zip) { Remove-Item CommandCenter_Final.zip -Force }
          Compress-Archive -Path CommandCenter.py -DestinationPath CommandCenter_Final.zip -Force

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CommandCenter-Final
          path: CommandCenter_Final.zip
          retention-days: 30
